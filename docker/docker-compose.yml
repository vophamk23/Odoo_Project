services:
  postgres:
    image: postgres:15-alpine
    container_name: phase3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatekeeper_phase3_db
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - phase3_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phase3_net

  odoo:
    image: odoo:19.0
    container_name: phase3_gatekeeper_odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    volumes:
      - phase3_odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ..:/mnt/custom_addons/t4_gate_keeper:ro
      - ../../t4_core_api:/mnt/custom_addons/t4_coreapi:ro
    command: -d gatekeeper_phase3_db -i t4_coreapi,t4_gate_keeper
    ports:
      - "8070:8069"
      - "8072:8072"
    networks:
      - phase3_net

volumes:
  phase3_postgres_data:
  phase3_odoo_data:

networks:
  phase3_net:
    driver: bridge
